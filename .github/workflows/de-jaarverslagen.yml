# Hulpmiddel voor ontwikkeling (alleen handmatig te starten): Duitse jaarverslagen (pdf van de beleggerssite of EQS) als tekst
# naar de tak jaarverslagen (map de/). Raakt de app niet.
name: Duitse jaarverslagen ophalen (ontwikkeling)
on:
  workflow_dispatch:
    inputs:
      bedrijven:
        description: "tickers gescheiden door spaties (leeg = alle in hulp/de_jaarverslagen.json)"
        required: false
        default: ""
      jaren:
        description: "bijv. 2016-2025"
        required: true
        default: "2016-2025"
permissions:
  contents: write
jobs:
  ophalen:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: pdftotext installeren
        run: sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Tak jaarverslagen ophalen
        run: git clone -q --depth 1 -b jaarverslagen "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jv
      - name: Downloaden
        run: python hulp/de_jaarverslagen.py jv/de ${{ inputs.bedrijven }} --jaren "${{ inputs.jaren }}"
      - name: Op tak jaarverslagen zetten
        run: |
          cd jv
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Duitse jaarverslagen $(date -u +%F)" || echo "niets nieuw"
          for i in 1 2 3; do git pull -q --rebase "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jaarverslagen && git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jaarverslagen && break; sleep 20; done
