# Hulpmiddel voor ontwikkeling (alleen handmatig te starten): bewaart de SEC-bestanden als download (artefact, 3 dagen).
name: SEC-bestanden ophalen (ontwikkeling)
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  ophalen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python hulp/sec_bestanden.py "${{ vars.SEC_CONTACT_EMAIL }}"
      - uses: actions/upload-artifact@v4
        with:
          name: sec-bestanden
          path: sec_bestanden
          retention-days: 3
