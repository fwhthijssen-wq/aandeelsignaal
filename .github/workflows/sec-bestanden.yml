# Hulpmiddel voor ontwikkeling (alleen handmatig te starten): zet de SEC-bestanden op de aparte tak 'ontwikkeldata'.
# Die tak staat los van de app en de nachtelijke update; hij wordt elke keer overschreven.
name: SEC-bestanden ophalen (ontwikkeling)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  ophalen:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python hulp/sec_bestanden.py "${{ vars.SEC_CONTACT_EMAIL }}"
      - name: Op tak ontwikkeldata zetten
        run: |
          cd sec_bestanden
          git init -q -b ontwikkeldata
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A
          git commit -qm "SEC-bestanden $(date -u +%F)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ontwikkeldata
