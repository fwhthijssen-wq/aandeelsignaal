# Hulpmiddel (ontwikkeling, handmatig): SEC-jaarfeiten per begrip en eenheid (uitkomst in het logboek).
name: SEC-feiten bekijken (ontwikkeling)
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'SEC-codes, gescheiden door spaties'
        required: true
permissions:
  contents: read
jobs:
  bekijk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - run: python3 hulp/sec_feiten.py "${{ vars.SEC_CONTACT_EMAIL }}" ${{ github.event.inputs.tickers }}
      - run: pip install -q -r requirements.txt 2>/dev/null || true
      - run: python3 hulp/sec_diagnose.py "${{ vars.SEC_CONTACT_EMAIL }}" ${{ github.event.inputs.tickers }}
