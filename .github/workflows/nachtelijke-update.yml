# Vernieuwt elke nacht de gegevens van Aandeel Signaal en publiceert de app op GitHub Pages (gratis).
name: Nachtelijke update
on:
  schedule:
    - cron: '17 3 * * 1-6'   # 03:17 UTC, maandag t/m zaterdag
  workflow_dispatch: {}
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Gegevens van de vorige run terughalen (goedgekeurde jaren hoeven niet opnieuw)
        uses: actions/cache/restore@v4
        with:
          path: web/data/aandelen.json
          key: gegevens-${{ github.run_id }}
          restore-keys: gegevens-
      - name: Jaarverslagarchief terughalen (elk jaarverslag wordt één keer bewaard en daarna niet meer aangeraakt)
        uses: actions/cache/restore@v4
        with:
          path: archief
          key: archief-${{ github.run_id }}
          restore-keys: archief-
      - name: Gegevens ophalen en controleren (bij een fout blijven de vorige gegevens staan)
        id: bouw
        continue-on-error: true
        run: python bouw_webdata.py --live --email "${{ vars.SEC_CONTACT_EMAIL }}"
      - name: Gegevens bewaren voor de volgende run
        if: steps.bouw.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: web/data/aandelen.json
          key: gegevens-${{ github.run_id }}
      - name: Jaarverslagarchief bewaren voor de volgende run
        if: always() && hashFiles('archief/**') != ''
        uses: actions/cache/save@v4
        with:
          path: archief
          key: archief-${{ github.run_id }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
