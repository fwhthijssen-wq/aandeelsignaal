# Vernieuwt elke nacht de gegevens van Aandeel Signaal en publiceert de app op GitHub Pages (gratis).
name: Nachtelijke update
on:
  schedule:
    - cron: '17 3 * * 1-6'   # 03:17 UTC, maandag t/m zaterdag
  workflow_dispatch: {}
  push:                      # een nieuwe app-versie meteen publiceren, niet pas 's nachts
    branches: [main]
    paths: ['web/**', 'VERSION']
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  bouw:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Gegevens van de vorige run terughalen (goedgekeurde jaren hoeven niet opnieuw)
        uses: actions/cache/restore@v5
        with:
          path: web/data/aandelen.json
          key: gegevens-${{ github.run_id }}
          restore-keys: gegevens-
      - name: Jaarverslagarchief terughalen (elk jaarverslag wordt één keer bewaard en daarna niet meer aangeraakt)
        uses: actions/cache/restore@v5
        with:
          path: archief
          key: archief-${{ github.run_id }}
          restore-keys: archief-
      - name: Vorige gegevens apart zetten (voor de kwaliteitsbewaker)
        run: cp web/data/aandelen.json vorige.json 2>/dev/null || true
      - name: Gegevens ophalen en controleren (bij een fout blijven de vorige gegevens staan)
        id: bouw
        continue-on-error: true
        run: python bouw_webdata.py --live --email "${{ vars.SEC_CONTACT_EMAIL }}"
      - name: Kwaliteitsbewaker (bij een ernstige daling blijven de gegevens van gisteren staan)
        id: bewaker
        if: steps.bouw.outcome == 'success'
        continue-on-error: true
        run: python bewaker.py vorige.json web/data/aandelen.json
      - name: Controle in het overzicht (zichtbaar als melding bij de run)
        if: always()
        run: |
          python - <<'PY'
          import json
          d = json.load(open('web/data/aandelen.json', encoding='utf-8'))
          L = d.get('aandelen', [])
          def _c(e):
              c = e.get('controle') or {}
              return f"{c.get('overeen')}/{c.get('vergeleken')}" if c.get('vergeleken') else '-'
          jv = sorted(f"{a['ticker']} {a['gegevens']['eps_jaarverslag']['jaren']}j Y{_c(a['gegevens']['eps_jaarverslag'])}" for a in L if (a.get('gegevens') or {}).get('eps_jaarverslag'))
          yahoo = sum(1 for a in L if (a.get('gegevens') or {}).get('bron') == 'Yahoo Finance')
          oud = sum(1 for a in L if (a.get('gegevens') or {}).get('uit_vorige_run'))
          def _neps(g):
              return sum(1 for j in (g.get('jaren') or []) if isinstance(j.get('comparable_eps'), (int, float)))
          ykort = sorted(a['ticker'] for a in L if (a.get('gegevens') or {}).get('bron') == 'Yahoo Finance' and not a['gegevens'].get('eps_jaarverslag'))
          kort = sorted(f"{a['ticker']}:{_neps(a.get('gegevens') or {})}" for a in L if (a.get('gegevens') or {}).get('bron') != 'Yahoo Finance' and _neps(a.get('gegevens') or {}) < 6)
          pc = sorted(f"{a['ticker']}:" + '+'.join(k[:3] for k, v in a['gegevens']['jaarcijfers_pdf'].items() if v.get('gebruikt')) for a in L if (a.get('gegevens') or {}).get('jaarcijfers_pdf'))
          print(f"::notice title=Pdf-jaarcijfers::{len(pc)} fondsen: {' '.join(pc)}")
          def _div(g):
              jr = [j for j in (g.get('jaren') or []) if j.get('koers_hoog')][-5:]
              return (len(jr), sum(1 for j in jr if j.get('dividend_ps')))
          geendiv = sorted(a['ticker'] for a in L if _div(a.get('gegevens') or {})[0] >= 3 and _div(a.get('gegevens') or {})[1] == 0)
          print(f"::notice title=Dividend::{len(geendiv)} fondsen met koersen maar zonder dividend in de laatste 5 jaar: {' '.join(geendiv)}")
          ye = sorted(a['ticker'] for a in L if (a.get('gegevens') or {}).get('eps_yahoo'))
          print(f"::notice title=Yahoo-EPS::{len(ye)} fondsen met officiele cijfers maar winst per aandeel van Yahoo: {' '.join(ye)}")
          ag = [a for a in L if (a.get('gegevens') or {}).get('aangeleverd')]
          print(f"::notice title=Aangeleverd::{len(ag)} fondsen aangevuld, {sum(a['gegevens']['aangeleverd'].get('eps_jaren', 0) for a in ag)} jaren winst per aandeel, {sum(sum(a['gegevens']['aangeleverd'].get('velden', {}).values()) for a in ag)} cijfers; geweigerd {sum(sum(a['gegevens']['aangeleverd'].get('geweigerd', {}).values()) for a in ag)}, andere valuta {sum(a['gegevens']['aangeleverd'].get('valuta', 0) for a in ag)}")
          tb = [a for a in L if (a.get('gegevens') or {}).get('tweede_bron')]
          if tb:
              print(f"::notice title=Tweede bron::{len(tb)} fondsen vergeleken: {sum(a['gegevens']['tweede_bron']['overeen'] for a in tb)} van {sum(a['gegevens']['tweede_bron']['vergeleken'] for a in tb)} cijfers overeen; gecorrigeerd: {' '.join(a['ticker'] + ':' + ','.join(str(c['jaar']) for c in a['gegevens']['tweede_bron'].get('gecorrigeerd') or []) for a in tb if a['gegevens']['tweede_bron'].get('gecorrigeerd'))}; meeste afwijkingen: {' '.join(a['ticker'] + ':' + str(a['gegevens']['tweede_bron']['aantal_afwijkend']) for a in sorted(tb, key=lambda a: -a['gegevens']['tweede_bron']['aantal_afwijkend'])[:25])}")
          print(f"::notice title=Ontbreekt::Yahoo zonder jaarverslag-EPS ({len(ykort)}): {' '.join(ykort)} | officieel met minder dan 6 jaar EPS ({len(kort)}): {' '.join(kort)}")
          print(f"::notice title=Gegevens::{len(L)} fondsen, gemaakt {d.get('gemaakt')}; Yahoo {yahoo}; uit vorige run {oud}; winst per aandeel uit jaarverslag: {len(jv)} ({', '.join(jv)})")
          PY
      - name: Gegevens bewaren voor de volgende run
        if: steps.bouw.outcome == 'success' && steps.bewaker.outcome == 'success'
        uses: actions/cache/save@v5
        with:
          path: web/data/aandelen.json
          key: gegevens-${{ github.run_id }}
      - name: Jaarverslagarchief bewaren voor de volgende run
        if: always() && hashFiles('archief/**') != ''
        uses: actions/cache/save@v5
        with:
          path: archief
          key: archief-${{ github.run_id }}
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
  publiceer:
    needs: bouw
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
