# Hulpmiddel (alleen handmatig): jaarcijfers van enkele fondsen uit de gegevens van de laatste nachtelijke update,
# naar de tak jaarverslagen (debug/inspectie.txt). Raakt de app niet.
name: Fondsen inspecteren (ontwikkeling)
on:
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Tickers, gescheiden door spaties'
        required: true
permissions:
  contents: write
jobs:
  toon:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/cache/restore@v5
        with:
          path: web/data/aandelen.json
          key: gegevens-${{ github.run_id }}
          restore-keys: gegevens-
      - name: Toon
        env:
          TICKERS: ${{ inputs.tickers }}
        run: |
          python3 - > inspectie.txt <<'PY'
          import json, os
          d = json.load(open('web/data/aandelen.json'))
          want = os.environ['TICKERS'].split()
          if want == ['SAMENVATTING']:
              L = d['aandelen']; G = [a.get('gegevens') or {} for a in L]
              ttm = [a['ticker'] for a, g in zip(L, G) if g.get('ttm')]
              tw = [a['ticker'] for a, g in zip(L, G) if g.get('twee_bronnen_eens')]
              ind = [a['ticker'] for a, g in zip(L, G) if g.get('niveau') == 'indicatief']
              print('kwartaalwinst', len(ttm), 'van', len(L)); print('twee bronnen eens', len(tw), 'van', len(ind), 'indicatief:', ' '.join(tw))
              for a, g in list(zip(L, G))[:400]:
                  if g.get('ttm'):
                      jr = [j for j in g.get('jaren') or [] if isinstance(j.get('comparable_eps'), (int, float))]
                      print(' ', a['ticker'], 'ttm', g['ttm']['eps'], 'tot', g['ttm']['tot'], 'jaar', jr[-1]['year'] if jr else None, jr[-1]['comparable_eps'] if jr else None)
              raise SystemExit
          if want == ['NAREKENEN']:
              for a in d['aandelen']:
                  g = a.get('gegevens') or {}
                  if g.get('pdf_narekening') or any(j.get('eps_bron') == 'jaarverslag' for j in g.get('jaren') or []):
                      pn = g.get('pdf_narekening') or {}
                      jr = [j for j in g.get('jaren') or [] if j.get('eps_bron') == 'jaarverslag']
                      mis = [f"{j['year']}:{j.get('comparable_eps')}x?={j.get('net_income')}" for j in jr if not j.get('eps_narekening')]
                      print(a['ticker'], 'nagerekend', pn.get('jaren', 0), 'van', len(jr), 'bevestigd' if pn.get('bevestigd') else '', 'mist:', ' '.join(mis)[:600])
              raise SystemExit
          if want == ['GEVERIFIEERD']:
              import collections
              c = collections.Counter(); per = collections.defaultdict(list)
              for a in d['aandelen']:
                  g = a.get('gegevens') or {}
                  if g.get('bron') != 'ESEF':
                      continue
                  n = g.get('eps_verified_years') or 0 if g.get('eps_status') in ('independently_verified', 'partially_independently_verified') else 0
                  jr = [j['year'] for j in g.get('jaren') or [] if isinstance(j.get('comparable_eps'), (int, float))]
                  c[n] += 1; per[n].append(f"{a['ticker']}({min(jr) if jr else '-'})")
              print(sorted(c.items()))
              for n in sorted(per, reverse=True):
                  print(n, ' '.join(per[n]))
              raise SystemExit
          if want == ['ESEFJV']:
              lijst = []
              for a in d['aandelen']:
                  g = a.get('gegevens') or {}
                  if g.get('bron') == 'ESEF' and not (g.get('eps_status') == 'independently_verified' and (g.get('eps_verified_years') or 0) >= 10):
                      n = sum(1 for j in g.get('jaren') or [] if isinstance(j.get('comparable_eps'), (int, float)))
                      ni = sum(1 for j in g.get('jaren') or [] if isinstance(j.get('net_income'), (int, float)) and 'net_income' not in (j.get('aangeleverd') or []))
                      lijst.append(f"{a['ticker']}:{n}/{ni}")
              print(len(lijst)); print(' '.join(lijst))
              raise SystemExit
          if want == ['VALUTA']:
              for a in d['aandelen']:
                  jr = (a.get('gegevens') or {}).get('jaren') or []
                  c = [j.get('currency') for j in jr if j.get('currency')]
                  if len(set(c)) > 1:
                      print(a['ticker'], a.get('valuta'), ' '.join(f"{j.get('year')}:{j.get('currency')}" for j in jr))
              raise SystemExit
          for a in d['aandelen']:
              if a['ticker'] in want:
                  g = a.get('gegevens') or {}
                  print('=====', a['ticker'], 'niveau', g.get('niveau'), 'bron', g.get('bron'), 'eps_status', g.get('eps_status'), g.get('eps_verified_years'))
                  for j in g.get('jaren') or []:
                      print(j.get('year'), j.get('currency'), 'eps', j.get('comparable_eps'), 'rep', j.get('reported_eps'), 'ni', j.get('net_income'), 'sh', j.get('shares_diluted'), 'bron', j.get('eps_bron'), 'corr', j.get('eps_correctie'), 'aang', j.get('aangeleverd'), 'check', j.get('eps_check'), 'narek', (j.get('eps_narekening') or {}).get('nettowinst_bron'))
                  print('tweede_bron', json.dumps(g.get('tweede_bron'))[:300]); print('pdf_narekening', json.dumps(g.get('pdf_narekening'))[:300])
          PY
      - name: Op tak jaarverslagen zetten (debug/inspectie.txt)
        run: |
          cat inspectie.txt | head -50
          git clone -q --depth 1 -b jaarverslagen "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jv
          mkdir -p jv/debug && cp inspectie.txt jv/debug/
          cd jv
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Inspectie $(date -u +%F)" || echo "niets nieuw"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jaarverslagen
