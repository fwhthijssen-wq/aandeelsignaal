# Hulpmiddel voor ontwikkeling (alleen handmatig te starten): jaarverslagen van Londense beursfondsen uit het officiële
# Britse register (FCA National Storage Mechanism) als tekst naar de tak jaarverslagen (map uk/). Raakt de app niet.
name: Britse jaarverslagen ophalen (ontwikkeling)
on:
  workflow_dispatch:
    inputs:
      bedrijven:
        description: "TICKER=LEI of TICKER=ISIN, gescheiden door ';' (leeg = alle Londense noteringen)"
        required: false
        default: ""
      jaren:
        description: "bijv. 2016-2019"
        required: true
        default: "2015-2019"
permissions:
  contents: write
jobs:
  ophalen:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: pdftotext installeren
        run: sudo apt-get install -y -qq poppler-utils >/dev/null
      - name: Tak jaarverslagen ophalen
        run: git clone -q --depth 1 -b jaarverslagen "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jv
      - name: Zoeken en downloaden
        env:
          BEDRIJVEN: ${{ inputs.bedrijven }}
        run: |
          IFS=';' read -ra B <<< "$BEDRIJVEN"
          ARGS=(); for b in "${B[@]}"; do b="$(echo "$b" | sed 's/^ *//;s/ *$//')"; [ -n "$b" ] && ARGS+=("$b"); done
          python hulp/uk_jaarverslagen.py jv/uk "${ARGS[@]}" --jaren "${{ inputs.jaren }}"
      - name: Op tak jaarverslagen zetten
        run: |
          cd jv
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Britse jaarverslagen $(date -u +%F)" || echo "niets nieuw"
          git push -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" jaarverslagen
